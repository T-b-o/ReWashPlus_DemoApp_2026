name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Required permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish ReWashPlus_DemoApp.csproj -c Release -o release --nologo

      # GitHub Pages serves the app under /ReWashPlus_DemoApp_2026/
      # so the Blazor base href and service worker base must match that path.
      - name: Fix base href and service worker for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/ReWashPlus_DemoApp_2026/" />|g' release/wwwroot/index.html
          sed -i 's|const base = "/ReWashPlus_DemoApp_2026/";|const base = "/ReWashPlus_DemoApp_2026/";|g' release/wwwroot/service-worker.published.js

      # Blazor WASM handles its own client-side routing, so copying index.html
      # to 404.html lets GitHub Pages serve the app for any deep-link URL.
      - name: Copy index.html to 404.html (SPA routing fallback)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # Prevents GitHub's Jekyll processor from ignoring _framework/ folder
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
