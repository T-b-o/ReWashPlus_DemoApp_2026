<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>ReWashPlus</title>
    <script>
        // SPA routing workaround for GitHub Pages.
        // When GitHub Pages cannot find a file it serves this 404.html.
        // This script encodes the requested path into the query string and
        // redirects to index.html, which then restores the original URL
        // before Blazor boots so the router lands on the correct page.
        //
        // pathSegmentsToKeep = 1 → site is in a subfolder:
        //   https://t-b-o.github.io/ReWashPlus_DemoApp_2026/
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
